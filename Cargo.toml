[workspace]
resolver = "2"
members = [
    "crates/pilot-arena",
    "crates/pilot-span",
    "crates/pilot-intern",
    "crates/pilot-ast",
    "crates/pilot-lexer",
    "crates/pilot-parser",
    "crates/pilot-analysis",
    "crates/pilot-rt",
    "crates/pilot-vm",
    "crates/pilot-ffi",
    "crates/pilot-cli",
]

[workspace.package]
version = "1.1.51"
edition = "2021"
license = "MIT"
repository = "https://github.com/moonxbears/Pilot"

[profile.dev]
opt-level = 2
debug = 0

[profile.test]
opt-level = 2
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
