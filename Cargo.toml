[workspace]
resolver = "2"
members = [
    "crates/pilot-arena",
    "crates/pilot-span",
    "crates/pilot-intern",
    "crates/pilot-ast",
    "crates/pilot-lexer",
    "crates/pilot-parser",
    "crates/pilot-syntax",
    "crates/pilot-fmt",
    "crates/pilot-incremental",
    "crates/pilot-db",
    "crates/pilot-lsp-macros",
    "crates/pilot-lsp",
    "crates/pilot-analysis",
    "crates/pilot-perceus",
    "crates/pilot-rt",
    "crates/pilot-vm",
    "crates/pilot-codegen",
    "crates/pilot-transpile",
    "crates/pilot-polyglot",
    "crates/pilot-dap",
    "crates/pilot-pkg",
    "crates/pilot-perf",
    "crates/pilot-ffi",
    "crates/pilot-cli",
    "crates/pilot-bench",
]

[workspace.package]
version = "1.1.51"
edition = "2021"
license = "MIT"
repository = "https://github.com/pilot-lang/pilot"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
