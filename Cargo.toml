[workspace]
resolver = "2"
members = [
    "crates/pilot-arena",
    "crates/pilot-span",
    "crates/pilot-intern",
    "crates/pilot-ast",
    "crates/pilot-ffi",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pilot-lang/pilot"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
